[package]
name = "codegen"
version = "0.0.0"
edition = "2024"
description = "Probes for assembly-aware analysis: never-inlined wrappers of a crate's API, compiled as its users compile them"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# `#[codegen::probe]`, re-exported as `probe`
codegen-macros = { path = "../codegen-macros" }
