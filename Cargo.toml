[package]
name = "veloce"
version = "0.1.0"
edition = "2024"
description = "Performant data structures in Rust"
keywords = ["lock-free", "spsc", "channel", "async", "no-std"]
categories = ["concurrency", "data-structures", "asynchronous"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/fedemagnani/veloce"

[workspace]
members = ["codegen", "cargo-codegen"]
# plain `cargo` commands at the root keep building and testing veloce alone
default-members = ["."]

[features]
default = ["spsc", "swmr", "async"]
# slot storage of the ring buffers, exposing the `Storable` trait
ring = []
# lock-free bounded single-producer-single-consumer channels
spsc = ["ring", "dep:crossbeam-utils", "dep:paste"]
# single-writer-multi-reader register of the latest value
swmr = ["dep:crossbeam-utils"]
# compile-time perfect hash sets and maps
perfect-hash = ["dep:paste"]
# async waiting for the enabled primitives
async = ["dep:futures"]
# requires nightly: `cargo +nightly bench --features bench`
bench = ["spsc", "swmr", "perfect-hash"]
# `bench` plus the perfect_hash key sets whose lookup path another set already covers
bench-full = ["bench"]
# probes of the hot paths for `cargo codegen`, which expands them in a downstream crate it generates
codegen = ["dep:codegen"]

[dependencies]
crossbeam-utils = { version = "0.8.21", optional = true }
futures = { version = "0.3.31", optional = true }
paste = { version = "1.0.15", optional = true }
codegen = { path = "codegen", optional = true }

[dev-dependencies]
criterion = "0.8.1"
crossbeam-channel = "0.5.15"
num_cpus = "1.17.0"
kanal = "0.1.1"
flume = { version = "0.12.0", features = ["spin"] }
tokio = { version = "1.48.0", features = ["macros", "rt", "sync"] }
arc-swap = "1.9.2"
left-right = "0.11.8"
triple_buffer = "9.0.0"
seqlock = "0.2.0"
phf = { version = "0.14.0", features = ["macros"] }
hashbrown = "0.17.1"
ahash = "0.8.12"
rustc-hash = "2.1.3"
libc = "0.2"

[[test]]
name = "swmr_stress"
required-features = ["swmr"]

[[bench]]
name = "main"
required-features = ["bench"]

# what `cargo codegen` builds: the default features, perfect_hash and `codegen`, expanding these probe macros
[package.metadata.codegen]
features = ["perfect-hash"]
probes = ["swmr_probes", "swmr_async_probes", "spsc_probes", "perfect_hash_probes"]
