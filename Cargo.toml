[package]
name = "veloce"
version = "0.1.0"
edition = "2024"
description = "Performant data structures in Rust"
keywords = ["lock-free", "spsc", "channel", "async", "no-std"]
categories = ["concurrency", "data-structures", "asynchronous"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/fedemagnani/veloce"

[features]
default = ["async"]
async = ["futures"]
# compile-time perfect hash sets and maps
perfect-hash = []
# requires nightly: `cargo +nightly bench --features bench`
bench = ["perfect-hash"]
# `bench` plus the perfect_hash key sets whose lookup path another set already covers
bench-full = ["bench"]

[dependencies]
crossbeam-utils = "0.8.21"
futures = { version = "0.3.31", optional = true }
paste = "1.0.15"

[dev-dependencies]
criterion = "0.8.1"
crossbeam-channel = "0.5.15"
num_cpus = "1.17.0"
kanal = "0.1.1"
flume = { version = "0.12.0", features = ["spin"] }
tokio = { version = "1.48.0", features = ["macros", "rt", "sync"] }
arc-swap = "1.9.2"
left-right = "0.11.8"
triple_buffer = "9.0.0"
seqlock = "0.2.0"
phf = { version = "0.14.0", features = ["macros"] }
hashbrown = "0.17.1"
ahash = "0.8.12"
rustc-hash = "2.1.3"
libc = "0.2"

[[bench]]
name = "main"
required-features = ["bench"]
